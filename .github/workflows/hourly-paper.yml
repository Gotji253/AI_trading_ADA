name: Hourly Paper Trading

on:
  schedule:
    - cron: '0 * * * *'  # Every hour at minute 0
  workflow_dispatch:  # Allow manual trigger

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || pip install pandas requests python-dotenv

      - name: Run hourly paper trading cycle
        env:
          TRADING_ASSETS: BTCUSDT,ETHUSDT,BNBUSDT
          TRADING_MODE: paper
          CHECK_INTERVAL_SECONDS: 3600
        run: |
          python -m src.realtime.hourly_runner
