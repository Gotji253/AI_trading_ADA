name: Accuracy Test (Binance)

on:
  workflow_dispatch:
    inputs:
      lookback_bars:
        description: 'Number of 1h bars to test'
        required: false
        default: '500'
      forward_bars:
        description: 'Forward bars for evaluation'
        required: false
        default: '12'
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 02:00 UTC

jobs:
  test-accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install pandas requests python-dotenv

      - name: Run Regime Accuracy Test (Binance with API Key)
        env:
          PYTHONPATH: ${{ github.workspace }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        run: |
          echo "=== Regime_Agent Accuracy Test (with API Key) ==="
          python -m src.backtest.regime_validator || echo "Regime test failed or limited data"

      - name: Run Synthetic Regime Test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "=== Synthetic Regime Test ==="
          python -m src.backtest.regime_validator_synthetic

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-results
          path: |
            **/*accuracy*.json
            **/*result*.txt
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## Accuracy Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Source: Binance (with API Key from secrets)" >> $GITHUB_STEP_SUMMARY
          echo "- Regime validator and synthetic tests completed" >> $GITHUB_STEP_SUMMARY
          echo "- Check logs above for detailed results" >> $GITHUB_STEP_SUMMARY
