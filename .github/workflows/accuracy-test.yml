name: Accuracy Test (Crypto.com)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  test-accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install pandas requests python-dotenv

      - name: Test Crypto.com Data Fetch
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "=== Crypto.com Data Fetch Test ==="
          python -c "
from src.data.crypto_com_fetcher import CryptoComFetcher
f = CryptoComFetcher()
df = f.get_ohlcv('1h', 50)
print(f'Candles fetched: {len(df)}')
if not df.empty:
    print(f'Latest price: {df.close.iloc[-1]:.5f}')
    print(f'Date range: {df.index.min()} to {df.index.max()}')
"

      - name: Run Synthetic Regime Test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "=== Synthetic Regime Test ==="
          python -m src.backtest.regime_validator_synthetic

      - name: Summary
        if: always()
        run: |
          echo "## Accuracy Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Primary source: Crypto.com" >> $GITHUB_STEP_SUMMARY
          echo "- Synthetic test included" >> $GITHUB_STEP_SUMMARY
